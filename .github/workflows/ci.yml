name: Backend checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw
      # Tests select their isolated H2 profile and do not need Aiven/SMTP/Stripe secrets.
      - run: ./mvnw -B -ntp verify
