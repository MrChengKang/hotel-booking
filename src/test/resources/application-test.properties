spring.config.import=
spring.datasource.url=jdbc:h2:mem:staytest;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
app.cors.allowed-origins=http://localhost:3000

# Legacy fixtures exercise the original unpaid reservation flow. Payment tests enable sandbox mode explicitly.
app.payments.enabled=false
app.payments.scheduling-enabled=false
app.admin.bootstrap.enabled=false
