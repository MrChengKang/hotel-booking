spring.application.name=hotel-booking
spring.profiles.default=local

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# React development origins; use explicit HTTPS origins in production.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
spring.jpa.open-in-view=false
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never

# Gmail SMTP. Set these values only in the backend .env.local.
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.default-encoding=UTF-8

# Photo bytes use local disk or Cloudinary; MySQL stores stable storage keys only.
app.media.directory=${STAY_MEDIA_DIRECTORY:./uploads/hotel-images}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Sandbox only. Secret keys never belong in React or Git.
app.payments.enabled=${STAY_PAYMENTS_ENABLED:true}
app.payments.stripe-secret=${STRIPE_SECRET_KEY:}
app.payments.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.payments.scheduling-enabled=${STAY_PAYMENT_SCHEDULING_ENABLED:true}

# Opt-in server-side bootstrap. No default administrator credentials.
app.admin.bootstrap.enabled=${STAY_ADMIN_BOOTSTRAP_ENABLED:false}
app.admin.bootstrap.email=${STAY_ADMIN_EMAIL:}
app.admin.bootstrap.name=${STAY_ADMIN_NAME:Platform Admin}
app.admin.bootstrap.password=${STAY_ADMIN_PASSWORD:}

# Keep stable across restarts/instances. Empty uses a per-boot development key.
app.auth.remember-key=${STAY_REMEMBER_ME_KEY:}

# Backend-only Cloudinary credentials. Enable explicitly after configuring keys.
app.media.provider=${STAY_MEDIA_PROVIDER:local}
app.media.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.media.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.media.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
app.media.cloudinary.prefix=${STAY_CLOUDINARY_PREFIX:stay}

# Explicit email provider. Brevo uses HTTPS, not SMTP relay credentials.
app.mail.provider=${STAY_MAIL_PROVIDER:smtp}
app.mail.brevo.api-key=${BREVO_API_KEY:}
app.mail.brevo.sender-email=${BREVO_SENDER_EMAIL:}
app.mail.brevo.sender-name=${BREVO_SENDER_NAME:STAY}
